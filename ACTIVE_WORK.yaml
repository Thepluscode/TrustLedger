active:
  task: rederivable_case_bundle
  priority: P0                 # founder instruction, 2026-10-20: "GO" on the re-derivation verifier
  status: IN_PROGRESS
  claim_level: tested          # implemented -> tested -> production-observed -> customer-validated
  branch: codex/source-bound-proof
  source: "ACTIVE_WORK.yaml history 2026-10-20 (FOUNDER_OVERRIDE: GO on the recommendation to make bundle conclusions reproducible)"
  corroborated_by:
    - scripts/verify_recon_bundle.py
    - scripts/test_verify_recon_bundle.py
    - backend/src/main/java/com/trustledger/reconciliation/casework/CaseBundleService.java
  scope: >
    A reconciliation case bundle (recon-case-bundle/2) carries what every exception was computed from:
    each record an exception names, with the values the rules read and the exact source row, and the fee
    schedules on record. scripts/verify_recon_bundle.py, which shares no code with TrustLedger, proves each
    row against its hash and the source file, and recomputes every exception's amount; a finding it cannot
    recompute is reported as such, never passed. The follow-up after PR 177 requires every declared source
    file and binds each cited row to its record number before returning success. No migration or money movement.
    For the three generic CSV profiles, the verifier also reads canonical fields from named columns and
    replays full-run payment and simple settlement matching before confirming a missing counterpart or
    a cited comparison pair; duplicate delivery and distinct financial-effect groups must be complete.
    A status-transition finding can be replayed from the full generic-CSV charge history.
    A two-record generic-CSV refund mismatch is confirmed only for a unique reference allocation.
    A one-run bundle binds the listed exceptions to its recorded run count, type inventory, per-currency
    exposure totals, and run/ruleset IDs;
    for the generic CSV profiles an independent pass enumerates the complete finding set from all source rows,
    catching omitted findings even when the bundle's counts and totals are changed with them;
    for Checkout.com Financial Actions v2 without rejected or duplicate rows or unexported timestamp-zone
    settings, independently derive all
    settlement, settled refund and chargeback records from the complete report, replay refund settlement
    absence and dispute history, and reject a rehashed forged aggregate or coordinated omitted finding;
    for Adyen Settlement Details v1 without rejected or duplicate rows or unsupported timestamp zones,
    independently derive each line and composite fee from all report rows, then replay the complete finding set;
    for canonical provider-event-json v1 deliveries, independently parse every accepted or rejected body
    and replay the complete finding set alongside file imports;
    a multi-run bundle cannot prove historical issue inventory and remains unconfirmed.
    Unsupported conditions remain unconfirmed. This is local-tested only, pending CI and review.
  next_after_this: none authorised (bank/cash evidence reader waits for a real bank export)
  founder_lane_in_parallel: obtain one anonymised real bank export (CAMT.053 > MT940 > the bank's CSV)
  last_completed:
    task: timeline_backed_showcase
    claim_level: tested        # CI-verified on main; presentation layer, synthetic, not buyer-rehearsed
    pull_requests: [163]
    merge_commits: [cdb8646]
    before_that: imported_source_evidence_immutability (PR 162, e510cc6)

# Standing conditions, true regardless of the active task. Not work items.
invariants_in_force:
  - execution_surface: OFF in the pilot — ingestion, reconciliation, exceptions and evidence only
  - money_type: always `Money` (BigDecimal scale-4, HALF_EVEN, currency-safe); never raw double
  - ledger: the source of financial truth; balances are derived views
  - corrections: reversal entries, never edits — financial history is append-only
  - idempotency: same transfer request cannot be processed twice; a duplicate webhook must not
      duplicate a state transition
  - ambiguity: an ambiguous provider response is never treated as a confirmed failure
  - reconciliation: differences stay visible until explicitly resolved
  - tenancy: every query is tenant-scoped, no exceptions
  - evidence: never label VERIFIED without pasted evidence; never present synthetic or demo
      data as production or customer evidence

standing_gates:
  - id: market_gate
    command: python3 pilot/score_kill_test.py
    state: INCOMPLETE — exit 3; read the current figure from PROJECT_STATE.json, not from here
    governs: customer-proven expansion and production activation (AGENT_CONTEXT.md → The governor)
    blocks: production money movement; speculative or customer-specific expansion; irreversible or
      costly infrastructure or provider commitments; autonomous financial actions; unsupported
      customer, production or commercial claims
    does_not_block: essential implementation of the approved goal and golden workflow — DEFAULT CONTINUE
    discharged_by: qualified customer conversations, not code
  - id: data_resilience
    command: ~/.claude/scripts/data-resilience-gate scan .
    blocks: calling any persisting feature pilot-ready or production-ready
    note: a drill older than 90 days is stale; see PARKING_LOT.md for the four open gaps

parked:
  - id: opening_balances_bypass_the_ledger
    why: a money-semantics decision for the product owner, not an agent refactor
  - id: pre_existing_defects_from_casework
    why: found while doing something else; real, but not authorised
  - id: flyway_ssl_flake
    why: unexplained and unreproducible; a retry would hide it rather than fix it
  - id: data_resilience_gaps
    why: required before real money, not before the read-only pilot
  - id: market_gate_incomplete
    why: a standing gate, discharged by conversations; it steers priority and does not stop the
      implementation track (AGENT_CONTEXT.md → The governor)

dated_gates: []   # none found in the repository; an invented date is worse than an absent one

task_switch_requires:
