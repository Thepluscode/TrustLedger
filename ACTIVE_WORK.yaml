  branch: feat/import-rows-write-once
  source: "PARKING_LOT.md (\"Imported source rows are not write-once at the database\", 2026-10-02)"
  scope: >
    Make recon_import_rows write-once at the PostgreSQL boundary with the repository's existing
    evidence-mutation rejection mechanism: INSERT stays allowed; UPDATE, DELETE and TRUNCATE are
    refused. One migration, one real-PostgreSQL negative control that reddens when the guard is
    removed, the import/reconciliation/timeline/bundle surface re-run. No UI, no money movement,
    no schema redesign. A correction to imported evidence is a new import, never an edit.
  next_after_this: timeline-backed executive showcase (authorised to follow, not yet started)
